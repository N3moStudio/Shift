name: Build Shift IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify app and extension identities
        run: python3 scripts/check_app_identity.py
      - name: Verify source-only helper downloads
        run: python3 scripts/package_helpers.py --check
      - name: Test IPA validation and icon sources
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test Windows and cloud Find My helpers
        run: |
          python3 -m venv "$RUNNER_TEMP/findmy-qa"
          "$RUNNER_TEMP/findmy-qa/bin/python" -m pip install -r CloudFindMy/requirements.txt
          "$RUNNER_TEMP/findmy-qa/bin/python" -m unittest discover -s Companion -p "test_*.py" -v
          "$RUNNER_TEMP/findmy-qa/bin/python" -m unittest discover -s CloudFindMy -p "test_*.py" -v
      - name: Test status, privacy, and route rules
        run: swift test
      - name: Generate and build app with Live Activity extension
        id: ipa
        run: bash scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.ipa.outputs.ipa_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
