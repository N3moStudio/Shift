name: Locus
options:
  bundleIdPrefix: com.n3mostudio
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  # Icon Composer packages must be treated as a single file, not exploded.
  fileTypes:
    icon:
      file: true
settings:
  base:
    # Set your Apple Developer Team ID to build from source (see README).
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Locus:
    type: application
    platform: iOS
    sources:
      - path: Locus
        excludes:
          - "**/Info.plist"
      - path: Shared
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n3mostudio.shift
        PRODUCT_NAME: Locus
        MARKETING_VERSION: "2.5.2"
        CURRENT_PROJECT_VERSION: "50"
        INFOPLIST_FILE: Locus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Locus/Resources/Locus.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconGlacierDark AppIconGlacierTinted AppIconAfterhours AppIconAfterhoursDark AppIconAfterhoursTinted AppIconPorcelain AppIconPorcelainDark AppIconPorcelainTinted"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: LocusActivity
        embed: true
    scheme:
      gatherCoverageData: false
  LocusActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LocusActivity
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n3mostudio.shift.activity
        PRODUCT_NAME: LocusActivity
        MARKETING_VERSION: "2.5.2"
        CURRENT_PROJECT_VERSION: "50"
        CODE_SIGN_ENTITLEMENTS: LocusActivity/LocusActivity.entitlements
        INFOPLIST_FILE: LocusActivity/Info.plist
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
